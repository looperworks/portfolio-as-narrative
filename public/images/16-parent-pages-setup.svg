<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" font-family="'Circular Std','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      text { fill: #333; }
      .label { font-size: 11px; fill: #777; }
      .label-bold { font-size: 11px; fill: #1A1A1A; font-weight: 600; }
      .title { font-size: 16px; fill: #1A1A1A; font-weight: 600; }
      .white-text { font-size: 10px; fill: #FFF; font-weight: 600; }
      .accent-blue { fill: #3B7DD8; }
      .accent-red { fill: #E85D3A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="2000" height="2000" fill="white"/>

  <text x="400" y="36" text-anchor="middle" class="title">Parent Page Architecture</text>
  <line x1="30" y1="48" x2="770" y2="48" stroke="#D0D0D0" stroke-width="0.5"/>

  <!-- Panel 1: Cover, built directly, not a parent -->
  <rect x="20" y="60" width="150" height="300" fill="white" stroke="#D0D0D0" stroke-width="1.5" rx="5"/>
  <rect x="20" y="60" width="150" height="28" fill="#333" rx="5"/>
  <rect x="20" y="76" width="150" height="12" fill="#333"/>
  <text x="32" y="82" class="white-text">COVER (ONCE)</text>

  <rect x="35" y="100" width="120" height="215" fill="#FAFAFA" stroke="#D0D0D0" rx="2"/>
  <rect x="45" y="115" width="100" height="185" fill="none" stroke="#BBB" stroke-width="0.75" stroke-dasharray="4,3"/>

  <text x="95" y="166" text-anchor="middle" class="label" fill="#3B7DD8" font-weight="600">Title</text>
  <rect x="55" y="175" width="80" height="45" fill="#F0F4FA" stroke="#3B7DD8" stroke-width="1" rx="3"/>
  <rect x="65" y="188" width="60" height="8" fill="#333" rx="1"/>
  <rect x="70" y="202" width="50" height="5" fill="#BBB" rx="1"/>

  <text x="35" y="338" class="label" fill="#E85D3A" font-weight="600">Elements:</text>
  <text x="35" y="350" class="label">Portfolio title, your name</text>

  <text x="95" y="382" text-anchor="middle" class="label-bold">Cover</text>
  <text x="95" y="396" text-anchor="middle" class="label">No parent, built once</text>

  <!-- Arrow Cover to A -->
  <line x1="172" y1="200" x2="180" y2="200" stroke="#3B7DD8" stroke-width="1"/>
  <polygon points="180,196 188,200 180,204" fill="#3B7DD8"/>

  <!-- Panel 2: A-Intro, the Title Page parent -->
  <rect x="190" y="60" width="195" height="300" fill="white" stroke="#D0D0D0" stroke-width="1.5" rx="5"/>
  <rect x="190" y="60" width="195" height="28" fill="#333" rx="5"/>
  <rect x="190" y="76" width="195" height="12" fill="#333"/>
  <text x="206" y="82" class="white-text">A-INTRO (TITLE PAGE)</text>

  <rect x="210" y="100" width="155" height="215" fill="#FAFAFA" stroke="#D0D0D0" rx="2"/>
  <rect x="222" y="115" width="131" height="185" fill="none" stroke="#BBB" stroke-width="0.75" stroke-dasharray="4,3"/>

  <text x="287" y="145" text-anchor="middle" class="label" fill="#3B7DD8" font-weight="600">Title Area</text>
  <rect x="232" y="155" width="115" height="50" fill="#F0F4FA" stroke="#3B7DD8" stroke-width="1" rx="3"/>
  <rect x="242" y="168" width="70" height="8" fill="#333" rx="1"/>
  <rect x="242" y="182" width="55" height="5" fill="#BBB" rx="1"/>

  <rect x="232" y="215" width="70" height="12" fill="none" stroke="#D0D0D0" rx="2"/>
  <rect x="238" y="219" width="44" height="4" fill="#D0D0D0" rx="1"/>
  <text x="310" y="224" class="label" fill="#999">Date / Location</text>

  <text x="210" y="338" class="label" fill="#E85D3A" font-weight="600">Elements:</text>
  <text x="210" y="350" class="label">Title area, date</text>

  <text x="287" y="382" text-anchor="middle" class="label-bold">A</text>
  <text x="287" y="396" text-anchor="middle" class="label">Title Page Parent</text>

  <!-- Arrow A to B -->
  <line x1="387" y1="200" x2="395" y2="200" stroke="#3B7DD8" stroke-width="1"/>
  <polygon points="395,196 403,200 395,204" fill="#3B7DD8"/>

  <!-- Panel 3: B-Project, the Project Page parent -->
  <rect x="405" y="60" width="195" height="300" fill="white" stroke="#D0D0D0" stroke-width="1.5" rx="5"/>
  <rect x="405" y="60" width="195" height="28" fill="#333" rx="5"/>
  <rect x="405" y="76" width="195" height="12" fill="#333"/>
  <text x="421" y="82" class="white-text">B-PROJECT (PROJECT PAGE)</text>

  <rect x="425" y="100" width="155" height="215" fill="#FAFAFA" stroke="#D0D0D0" rx="2"/>
  <rect x="437" y="115" width="131" height="185" fill="none" stroke="#BBB" stroke-width="0.75" stroke-dasharray="4,3"/>

  <rect x="437" y="118" width="90" height="10" fill="none" stroke="#3B7DD8" stroke-width="0.75" rx="1"/>
  <rect x="442" y="121" width="54" height="4" fill="#3B7DD8" opacity="0.4" rx="1"/>
  <text x="533" y="126" class="label" fill="#3B7DD8" font-weight="600">Header</text>

  <g opacity="0.2">
    <line x1="447" y1="135" x2="447" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="464" y1="135" x2="464" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="481" y1="135" x2="481" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="498" y1="135" x2="498" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="515" y1="135" x2="515" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="532" y1="135" x2="532" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
    <line x1="549" y1="135" x2="549" y2="285" stroke="#3B7DD8" stroke-width="0.5"/>
  </g>

  <rect x="437" y="140" width="131" height="60" fill="#E8E8E8" stroke="#D0D0D0" rx="2"/>
  <line x1="437" y1="140" x2="568" y2="200" stroke="#D0D0D0" stroke-width="0.5"/>
  <line x1="568" y1="140" x2="437" y2="200" stroke="#D0D0D0" stroke-width="0.5"/>

  <rect x="437" y="210" width="131" height="4" fill="#D0D0D0" rx="1"/>
  <rect x="437" y="218" width="131" height="4" fill="#D0D0D0" rx="1"/>
  <rect x="437" y="226" width="90" height="4" fill="#D0D0D0" rx="1"/>

  <rect x="432" y="252" width="75" height="16" fill="#F0F4FA" stroke="#3B7DD8" stroke-width="0.75" rx="2"/>
  <rect x="437" y="258" width="47" height="5" fill="#3B7DD8" opacity="0.4" rx="1"/>
  <text x="513" y="264" class="label" fill="#3B7DD8" font-weight="600">Project Title</text>

  <line x1="427" y1="110" x2="427" y2="310" stroke="#E85D3A" stroke-width="0.75" stroke-dasharray="3,3"/>
  <text x="412" y="210" class="label" fill="#E85D3A" font-weight="600" text-anchor="end" transform="rotate(-90,412,210)">Binding &#xBD;&#x2033;</text>

  <text x="425" y="338" class="label" fill="#E85D3A" font-weight="600">Elements:</text>
  <text x="425" y="350" class="label">Header, grid guides, project title</text>

  <text x="502" y="382" text-anchor="middle" class="label-bold">B</text>
  <text x="502" y="396" text-anchor="middle" class="label">Project Page Parent</text>

  <!-- Arrow B to Pages Panel result -->
  <line x1="602" y1="200" x2="610" y2="200" stroke="#3B7DD8" stroke-width="1"/>
  <polygon points="610,196 618,200 610,204" fill="#3B7DD8"/>

  <!-- Panel 4: Pages Panel result -->
  <rect x="620" y="60" width="150" height="300" fill="white" stroke="#333" stroke-width="1" rx="3"/>
  <text x="632" y="82" class="label" fill="#E85D3A" font-weight="600">Pages Panel:</text>

  <rect x="632" y="98" width="12" height="12" fill="#BBB"/>
  <text x="652" y="108" class="label">1 &#183; Cover</text>

  <rect x="632" y="124" width="12" height="12" fill="#3B7DD8"/>
  <text x="652" y="134" class="label">2 &#183; A-Intro</text>

  <rect x="632" y="150" width="12" height="12" fill="#E85D3A"/>
  <text x="652" y="160" class="label">3 &#183; B-Project</text>

  <rect x="632" y="176" width="12" height="12" fill="#E85D3A"/>
  <text x="652" y="186" class="label">4 &#183; B-Project</text>

  <line x1="632" y1="202" x2="758" y2="202" stroke="#D0D0D0" stroke-width="0.5"/>

  <text x="632" y="222" class="label" fill="#E85D3A" font-weight="600">How It Works:</text>
  <text x="632" y="239" class="label-bold">Change a parent once &#x2192;</text>
  <text x="632" y="253" class="label">every page using it</text>
  <text x="632" y="267" class="label">updates automatically</text>
  <text x="632" y="285" class="label" fill="#999">Cover has no parent,</text>
  <text x="632" y="298" class="label" fill="#999">it stays independent.</text>

  <text x="695" y="382" text-anchor="middle" class="label-bold">Result</text>
  <text x="695" y="396" text-anchor="middle" class="label">Pages Panel</text>

</svg>
