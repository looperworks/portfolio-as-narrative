<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Circular Std','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; fill: #777; }
      .label-bold { font-size: 11px; fill: #1A1A1A; font-weight: 600; }
      .title { font-size: 16px; fill: #1A1A1A; font-weight: 600; }
      .num { font-size: 13px; fill: #2A2D3E; font-weight: 700; }
      .tick { font-size: 9px; fill: #999; }
    </style>
  </defs>

  <rect width="2000" height="2000" fill="white"/>

  <text x="400" y="34" text-anchor="middle" class="title">One Page, One Spread</text>
  <line x1="30" y1="46" x2="770" y2="46" stroke="#D8D6CC" stroke-width="0.5"/>

  <!-- LEFT: a single Letter page, drawn at true 8.5:11 proportion -->
  <text x="180" y="75" text-anchor="middle" class="label-bold">ONE PAGE: 8.5 &#215; 11 IN</text>
  <rect x="130" y="95" width="100" height="129" fill="#F5F3ED" stroke="#DEDBD0" stroke-width="1.5" rx="2"/>
  <text x="180" y="244" text-anchor="middle" class="num">612 &#215; 792 pt</text>
  <text x="180" y="261" text-anchor="middle" class="tick">Prints on real Letter paper</text>

  <!-- Arrow: two of them, side by side -->
  <text x="345" y="150" text-anchor="middle" class="num">&#215; 2</text>
  <text x="345" y="185" text-anchor="middle" class="tick">side by side</text>
  <polygon points="365,158 400,158 400,151 420,166 400,181 400,174 365,174" fill="#B45C6A"/>

  <!-- RIGHT: two pages forming a spread, drawn at true 17:11 proportion -->
  <text x="595" y="75" text-anchor="middle" class="label-bold">ONE SPREAD: 17 &#215; 11 IN</text>
  <rect x="465" y="95" width="100" height="129" fill="#F5F3ED" stroke="#2A2D3E" stroke-width="1.5"/>
  <rect x="565" y="95" width="100" height="129" fill="#F5F3ED" stroke="#2A2D3E" stroke-width="1.5"/>
  <line x1="565" y1="95" x2="565" y2="224" stroke="#B45C6A" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="595" y="244" text-anchor="middle" class="num">1224 &#215; 792 pt</text>
  <text x="595" y="261" text-anchor="middle" class="tick">Tabloid, turned sideways</text>

  <line x1="30" y1="292" x2="770" y2="292" stroke="#D8D6CC" stroke-width="0.5"/>

  <text x="400" y="318" text-anchor="middle" class="num">612 &#247; 12 = 51 &#160;&#160;&#160; 792 &#247; 12 = 66, both exact</text>
  <text x="400" y="340" text-anchor="middle" class="label">An inch is 72 points, six copies of the twelve-point unit,</text>
  <text x="400" y="356" text-anchor="middle" class="label">so any whole or half-inch page was already speaking this class's unit.</text>

  <line x1="30" y1="380" x2="770" y2="380" stroke="#D8D6CC" stroke-width="0.5"/>
  <text x="400" y="401" text-anchor="middle" class="label" font-style="italic">
    Chosen for what it does, not for how it looks: it prints, it pairs, and it still resolves to twelve.
  </text>
</svg>
