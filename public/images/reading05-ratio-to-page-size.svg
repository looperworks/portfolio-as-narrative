<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Circular Std','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; fill: #777; }
      .label-bold { font-size: 11px; fill: #1A1A1A; font-weight: 600; }
      .title { font-size: 16px; fill: #1A1A1A; font-weight: 600; }
      .num { font-size: 13px; fill: #2A2D3E; font-weight: 700; }
      .tick { font-size: 9px; fill: #999; }
    </style>
  </defs>

  <rect width="2000" height="2000" fill="white"/>

  <text x="400" y="34" text-anchor="middle" class="title">From a Shape to a Page Size</text>
  <line x1="30" y1="46" x2="770" y2="46" stroke="#D8D6CC" stroke-width="0.5"/>

  <!-- LEFT: the abstract 5:8 shape, drawn portrait at true proportion -->
  <text x="165" y="75" text-anchor="middle" class="label-bold">THE SHAPE: 5 : 8</text>
  <rect x="110" y="95" width="110" height="176" fill="#F5F3ED" stroke="#DEDBD0" stroke-width="1.5" rx="2"/>
  <text x="165" y="291" text-anchor="middle" class="label">5 units wide</text>
  <text x="165" y="306" text-anchor="middle" class="label">8 units tall</text>
  <text x="165" y="321" text-anchor="middle" class="tick" font-style="italic">no unit specified yet</text>

  <!-- Arrow with the multiplier, plus the derivation -->
  <text x="345" y="165" text-anchor="middle" class="num">&#215; 120</text>
  <text x="345" y="180" text-anchor="middle" class="tick">(120 = 10 &#215; 12)</text>
  <polygon points="370,175 410,175 410,168 430,183 410,198 410,191 370,191" fill="#B45C6A"/>
  <text x="345" y="222" text-anchor="middle" class="num">5 &#215; 120 = 600</text>
  <text x="345" y="240" text-anchor="middle" class="num">8 &#215; 120 = 960</text>

  <!-- RIGHT: the actual page, 600 x 960 pt, drawn portrait at true proportion -->
  <text x="610" y="75" text-anchor="middle" class="label-bold">THE PAGE: 600 &#215; 960 PT</text>
  <rect x="520" y="95" width="180" height="288" fill="#F5F3ED" stroke="#2A2D3E" stroke-width="1.5" rx="2"/>
  <text x="610" y="405" text-anchor="middle" class="num">600 &#215; 960 pt</text>
  <text x="610" y="422" text-anchor="middle" class="tick">600 &#247; 12 = 50 &#160;&#160;&#160; 960 &#247; 12 = 80, both exact</text>

  <line x1="30" y1="436" x2="770" y2="436" stroke="#D8D6CC" stroke-width="0.5"/>
  <text x="400" y="452" text-anchor="middle" class="label" font-style="italic">
    Same shape, same unit: the page's own edges already land on the twelve-point grid.
  </text>
</svg>
