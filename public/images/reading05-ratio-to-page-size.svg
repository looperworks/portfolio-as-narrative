<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Circular Std','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; fill: #777; }
      .label-bold { font-size: 11px; fill: #1A1A1A; font-weight: 600; }
      .title { font-size: 16px; fill: #1A1A1A; font-weight: 600; }
      .num { font-size: 13px; fill: #2A2D3E; font-weight: 700; }
      .tick { font-size: 9px; fill: #999; }
    </style>
  </defs>

  <rect width="2000" height="2000" fill="white"/>

  <text x="400" y="34" text-anchor="middle" class="title">From a Shape to a Page Size</text>
  <line x1="30" y1="46" x2="770" y2="46" stroke="#D8D6CC" stroke-width="0.5"/>

  <!-- LEFT: the abstract 5:7 shape -->
  <text x="160" y="80" text-anchor="middle" class="label-bold">THE SHAPE: 5 : 7</text>
  <rect x="90" y="100" width="140" height="196" fill="#F5F3ED" stroke="#DEDBD0" stroke-width="1.5" rx="2"/>
  <text x="160" y="315" text-anchor="middle" class="label">5 units wide</text>
  <text x="160" y="330" text-anchor="middle" class="label">7 units tall</text>
  <text x="160" y="345" text-anchor="middle" class="tick" font-style="italic">no unit specified yet</text>

  <!-- Arrow with the multiplier -->
  <text x="335" y="185" text-anchor="middle" class="num">&#215; 120</text>
  <text x="335" y="200" text-anchor="middle" class="tick">(120 = 10 &#215; 12)</text>
  <polygon points="360,195 400,195 400,188 420,203 400,218 400,211 360,211" fill="#B45C6A"/>

  <!-- RIGHT: the actual page, 600 x 840 pt -->
  <text x="610" y="80" text-anchor="middle" class="label-bold">THE PAGE: 600 &#215; 840 PT</text>
  <rect x="470" y="100" width="280" height="196" fill="#F5F3ED" stroke="#2A2D3E" stroke-width="1.5" rx="2"/>

  <!-- tick marks along the top edge, every 12pt worth (grouped, not literally 50 ticks) -->
  <g stroke="#B45C6A" stroke-width="1">
    <line x1="470" y1="100" x2="470" y2="108"/>
    <line x1="540" y1="100" x2="540" y2="108"/>
    <line x1="610" y1="100" x2="610" y2="108"/>
    <line x1="680" y1="100" x2="680" y2="108"/>
    <line x1="750" y1="100" x2="750" y2="108"/>
  </g>
  <text x="610" y="122" text-anchor="middle" class="tick">600 pt wide = 50 &#215; 12 pt, exactly</text>

  <g stroke="#B45C6A" stroke-width="1">
    <line x1="470" y1="100" x2="462" y2="100"/>
    <line x1="470" y1="149" x2="462" y2="149"/>
    <line x1="470" y1="198" x2="462" y2="198"/>
    <line x1="470" y1="247" x2="462" y2="247"/>
    <line x1="470" y1="296" x2="462" y2="296"/>
  </g>
  <text x="610" y="310" text-anchor="middle" class="tick">840 pt tall = 70 &#215; 12 pt, exactly</text>

  <text x="610" y="340" text-anchor="middle" class="num">5 &#215; 120 = 600</text>
  <text x="610" y="358" text-anchor="middle" class="num">7 &#215; 120 = 840</text>

  <line x1="30" y1="390" x2="770" y2="390" stroke="#D8D6CC" stroke-width="0.5"/>
  <text x="400" y="418" text-anchor="middle" class="label" font-style="italic">
    Same shape, same unit: the page's own edges already land on the twelve-point grid.
  </text>
</svg>
