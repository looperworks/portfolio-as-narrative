<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="64" font-size="11" font-weight="600" letter-spacing="2" fill="#5a7a8a">CATEGORY III OF V</text>
  <text x="62" y="104" font-size="32" font-weight="700" fill="#222">Visual Craft &amp; Consistency</text>
  <line x1="64" y1="126" x2="896" y2="126" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="156" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5a7a8a">PAY ATTENTION TO</text>
  <text x="64" y="178" font-size="16" fill="#444">Consistency in something specific — color, line weight, media —</text>
  <text x="64" y="200" font-size="16" fill="#444">not just a general feeling that it's "put together."</text>

  <!-- one accent color, three roles motif -->
  <g>
    <rect x="290" y="215" width="110" height="70" fill="#5a7a8a"/>
    <text x="345" y="299" font-size="11" fill="#5a7a8a" font-weight="600" text-anchor="middle">FILL</text>

    <rect x="425" y="215" width="110" height="70" fill="#fff" stroke="#5a7a8a" stroke-width="4"/>
    <text x="480" y="299" font-size="11" fill="#5a7a8a" font-weight="600" text-anchor="middle">LINE</text>

    <rect x="560" y="215" width="110" height="70" fill="#fff" stroke="#e8e8e8" stroke-width="1.5"/>
    <text x="615" y="260" font-size="30" fill="#5a7a8a" font-weight="700" text-anchor="middle">Aa</text>
    <text x="615" y="299" font-size="11" fill="#5a7a8a" font-weight="600" text-anchor="middle">TYPE</text>
  </g>

  <text x="64" y="336" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5a7a8a">HOW THE CLASS RESPONDED</text>
  <text x="64" y="358" font-size="15.5" fill="#333">Almost everyone flagged consistency as present or absent. The best notes</text>
  <text x="64" y="380" font-size="15.5" fill="#333">named the actual mechanism holding it together.</text>

  <rect x="64" y="404" width="404" height="40" fill="#f7f7f7"/>
  <rect x="64" y="404" width="3" height="40" fill="#5a7a8a"/>
  <text x="80" y="420" font-size="13.5" fill="#444" font-style="italic">"Beautifully curated color and line weight that even</text>
  <text x="80" y="435" font-size="13.5" fill="#444" font-style="italic">flows into the detail of the model."</text>

  <rect x="484" y="404" width="412" height="40" fill="#f7f7f7"/>
  <rect x="484" y="404" width="3" height="40" fill="#5a7a8a"/>
  <text x="500" y="420" font-size="13.5" fill="#444" font-style="italic">"The sketches are poorly scanned in, and the color</text>
  <text x="500" y="435" font-size="13.5" fill="#444" font-style="italic">palate jumps from B&amp;W to inconsistent colors."</text>
</svg>
