<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="72" font-size="11" font-weight="600" letter-spacing="2" fill="#222">ACROSS THE COHORT</text>
  <text x="62" y="128" font-size="38" font-weight="700" fill="#222">Patterns Across the Class</text>
  <line x1="64" y1="152" x2="896" y2="152" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="64" y="180" width="14" height="14" fill="#5a7a8a"/>
  <text x="96" y="192" font-size="19" font-weight="700" fill="#222">Real analytical tools, not captions</text>
  <text x="96" y="218" font-size="15" fill="#5f5f5f">Sequencing and hierarchy notes especially showed close, careful looking —</text>
  <text x="96" y="240" font-size="15" fill="#5f5f5f">not just description.</text>

  <line x1="64" y1="270" x2="896" y2="270" stroke="#f2f2f2" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="64" y="296" width="14" height="14" fill="#3d7a6b"/>
  <text x="96" y="308" font-size="19" font-weight="700" fill="#222">Specific, personal reasons</text>
  <text x="96" y="334" font-size="15" fill="#5f5f5f">The strongest "Why This One" answers named your own project or a real</text>
  <text x="96" y="356" font-size="15" fill="#5f5f5f">reaction — not generic praise.</text>

  <line x1="64" y1="386" x2="896" y2="386" stroke="#f2f2f2" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="64" y="412" width="14" height="14" fill="#a15c3f"/>
  <text x="96" y="424" font-size="19" font-weight="700" fill="#222">Real critiques, not just praise</text>
  <text x="96" y="450" font-size="15" fill="#5f5f5f">Some of you wrote "no hook," "too flat," "doesn't read as an argument" —</text>
  <text x="96" y="472" font-size="15" fill="#5f5f5f">exactly the instinct this exercise is built to develop.</text>
</svg>
