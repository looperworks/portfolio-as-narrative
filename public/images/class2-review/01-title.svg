      <text x="244" y="392" fill="#757575">II</text>
      <text x="244" y="416" fill="#222" font-size="12" font-weight="700">Curation</text>
      <text x="244" y="432" fill="#6b6b6b" font-size="10" font-weight="400">Image Selection</text>
