      <text x="410" y="392" fill="#757575">III</text>
      <text x="410" y="416" fill="#222" font-size="12" font-weight="700">Craft</text>
      <text x="410" y="432" fill="#6b6b6b" font-size="10" font-weight="400">Visual Consistency</text>
