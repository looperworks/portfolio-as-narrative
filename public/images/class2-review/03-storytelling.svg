<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="60" font-size="11" font-weight="600" letter-spacing="2" fill="#6b4c7a">CATEGORY I OF V</text>
  <text x="62" y="108" font-size="32" font-weight="700" fill="#222">Storytelling &amp; Narrative Arc</text>
  <line x1="64" y1="130" x2="896" y2="130" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="164" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b4c7a">PAY ATTENTION TO</text>
  <text x="64" y="188" font-size="16" fill="#444">How the sequence of images carries the argument —</text>
  <text x="64" y="210" font-size="16" fill="#444">not just what the project is about.</text>

  <!-- arc motif -->
  <g>
    <path d="M300,320 Q480,240 660,320" fill="none" stroke="#6b4c7a" stroke-width="2.5"/>
    <circle cx="300" cy="320" r="5" fill="#6b4c7a"/>
    <circle cx="480" cy="280" r="5" fill="#6b4c7a"/>
    <circle cx="660" cy="320" r="5" fill="#6b4c7a"/>
    <text x="300" y="348" font-size="11" fill="#757575" text-anchor="middle">SETUP</text>
    <text x="480" y="348" font-size="11" fill="#757575" text-anchor="middle">TURN</text>
    <text x="660" y="348" font-size="11" fill="#757575" text-anchor="middle">RESOLUTION</text>
  </g>

  <text x="64" y="404" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b4c7a">HOW THE CLASS RESPONDED</text>
  <text x="64" y="428" font-size="15.5" fill="#333">Most of you could name where a project's story started and ended. The</text>
  <text x="64" y="450" font-size="15.5" fill="#333">sharpest notes went further, naming the exact spread where the story turns.</text>

  <rect x="64" y="474" width="404" height="46" fill="#f7f7f7"/>
  <rect x="64" y="474" width="3" height="46" fill="#6b4c7a"/>
  <text x="80" y="500" font-size="13.5" fill="#444" font-style="italic">"Zooms out, then zooms back in."</text>

  <rect x="484" y="474" width="412" height="46" fill="#f7f7f7"/>
  <rect x="484" y="474" width="3" height="46" fill="#6b4c7a"/>
  <text x="500" y="493" font-size="13.5" fill="#444" font-style="italic">"Reads like a presentation: context,</text>
  <text x="500" y="510" font-size="13.5" fill="#444" font-style="italic">then program, then resolution."</text>
</svg>
