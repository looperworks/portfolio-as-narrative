<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="72" font-size="11" font-weight="600" letter-spacing="2" fill="#6b4c7a">CATEGORY I OF V</text>
  <text x="62" y="116" font-size="32" font-weight="700" fill="#222">Storytelling &amp; Narrative Arc</text>
  <line x1="64" y1="138" x2="896" y2="138" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="168" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b4c7a">PAY ATTENTION TO</text>
  <text x="64" y="190" font-size="16" fill="#444">How the sequence of images carries the argument —</text>
  <text x="64" y="212" font-size="16" fill="#444">not just what the project is about.</text>

  <!-- arc motif -->
  <g>
    <path d="M300,300 Q480,220 660,300" fill="none" stroke="#6b4c7a" stroke-width="2.5"/>
    <circle cx="300" cy="300" r="5" fill="#6b4c7a"/>
    <circle cx="480" cy="260" r="5" fill="#6b4c7a"/>
    <circle cx="660" cy="300" r="5" fill="#6b4c7a"/>
    <text x="300" y="328" font-size="11" fill="#757575" text-anchor="middle">SETUP</text>
    <text x="480" y="328" font-size="11" fill="#757575" text-anchor="middle">TURN</text>
    <text x="660" y="328" font-size="11" fill="#757575" text-anchor="middle">RESOLUTION</text>
  </g>

  <text x="64" y="360" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b4c7a">HOW THE CLASS RESPONDED</text>
  <text x="64" y="382" font-size="15.5" fill="#333">Most of you could name where a project's story started and ended. The</text>
  <text x="64" y="404" font-size="15.5" fill="#333">sharpest notes went further, naming the exact spread where the story turns.</text>

  <rect x="64" y="428" width="404" height="44" fill="#f7f7f7"/>
  <rect x="64" y="428" width="3" height="44" fill="#6b4c7a"/>
  <text x="80" y="455" font-size="13.5" fill="#444" font-style="italic">"Zooms out, then zooms back in."</text>

  <rect x="484" y="428" width="412" height="44" fill="#f7f7f7"/>
  <rect x="484" y="428" width="3" height="44" fill="#6b4c7a"/>
  <text x="500" y="446" font-size="13.5" fill="#444" font-style="italic">"Reads like a presentation: context,</text>
  <text x="500" y="463" font-size="13.5" fill="#444" font-style="italic">then program, then resolution."</text>
</svg>
