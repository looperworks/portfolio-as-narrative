<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="64" font-size="11" font-weight="600" letter-spacing="2" fill="#a15c3f">CATEGORY V OF V</text>
  <text x="62" y="104" font-size="32" font-weight="700" fill="#222">Structure &amp; Hierarchy</text>
  <line x1="64" y1="126" x2="896" y2="126" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="156" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a15c3f">PAY ATTENTION TO</text>
  <text x="64" y="178" font-size="16" fill="#444">Whether the layout tells the eye what to look at first — hierarchy</text>
  <text x="64" y="200" font-size="16" fill="#444">isn't the same as being organized.</text>

  <!-- hierarchy motif -->
  <g>
    <rect x="270" y="215" width="210" height="70" fill="#f6e9e4" stroke="#a15c3f" stroke-width="1.5"/>
    <circle cx="290" cy="231" r="10" fill="#a15c3f"/>
    <text x="290" y="235" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">1</text>

    <rect x="510" y="215" width="180" height="20" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="524" cy="225" r="7" fill="#c99b87"/>
    <text x="524" y="228" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="700">2</text>

    <rect x="510" y="241" width="180" height="20" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="524" cy="251" r="7" fill="#c99b87"/>
    <text x="524" y="254" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="700">3</text>

    <rect x="510" y="267" width="180" height="18" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="524" cy="276" r="7" fill="#c99b87"/>
    <text x="524" y="279" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>

    <text x="270" y="299" font-size="11" fill="#a15c3f" font-weight="600">READS FIRST</text>
    <text x="510" y="299" font-size="11" fill="#757575" font-weight="600">SUPPORTS THE ARGUMENT</text>
  </g>

  <text x="64" y="336" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a15c3f">HOW THE CLASS RESPONDED</text>
  <text x="64" y="358" font-size="15.5" fill="#333">Most of you could identify what was largest or most prominent. The</text>
  <text x="64" y="380" font-size="15.5" fill="#333">strongest notes told a grid apart from a real hierarchy.</text>

  <rect x="64" y="404" width="404" height="58" fill="#f7f7f7"/>
  <rect x="64" y="404" width="3" height="58" fill="#a15c3f"/>
  <text x="80" y="420" font-size="13.5" fill="#444" font-style="italic">"There is always a grab, whether that be the size</text>
  <text x="80" y="435" font-size="13.5" fill="#444" font-style="italic">of the render or the splash of color, that draws</text>
  <text x="80" y="450" font-size="13.5" fill="#444" font-style="italic">the eye first."</text>

  <rect x="484" y="404" width="412" height="58" fill="#f7f7f7"/>
  <rect x="484" y="404" width="3" height="58" fill="#a15c3f"/>
  <text x="500" y="420" font-size="13.5" fill="#444" font-style="italic">"There wasn't a very clear hierarchy and structure,</text>
  <text x="500" y="435" font-size="13.5" fill="#444" font-style="italic">each page was gridded slightly different."</text>
</svg>
