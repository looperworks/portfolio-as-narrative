<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="60" font-size="11" font-weight="600" letter-spacing="2" fill="#a15c3f">CATEGORY V OF V</text>
  <text x="62" y="108" font-size="32" font-weight="700" fill="#222">Structure &amp; Hierarchy</text>
  <line x1="64" y1="130" x2="896" y2="130" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="164" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a15c3f">PAY ATTENTION TO</text>
  <text x="64" y="188" font-size="16" fill="#444">Whether the layout tells the eye what to look at first — hierarchy</text>
  <text x="64" y="210" font-size="16" fill="#444">isn't the same as being organized.</text>

  <!-- hierarchy motif -->
  <g>
    <rect x="270" y="240" width="210" height="90" fill="#f6e9e4" stroke="#a15c3f" stroke-width="1.5"/>
    <circle cx="290" cy="260" r="11" fill="#a15c3f"/>
    <text x="290" y="264" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text>

    <rect x="510" y="240" width="180" height="25" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="527" cy="252" r="9" fill="#c99b87"/>
    <text x="527" y="256" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">2</text>

    <rect x="510" y="272" width="180" height="25" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="527" cy="284" r="9" fill="#c99b87"/>
    <text x="527" y="288" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">3</text>

    <rect x="510" y="304" width="180" height="25" fill="#f7f7f7" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="527" cy="316" r="9" fill="#c99b87"/>
    <text x="527" y="320" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">4</text>

    <text x="270" y="350" font-size="11" fill="#a15c3f" font-weight="600">READS FIRST</text>
    <text x="510" y="350" font-size="11" fill="#757575" font-weight="600">SUPPORTS THE ARGUMENT</text>
  </g>

  <text x="64" y="404" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a15c3f">HOW THE CLASS RESPONDED</text>
  <text x="64" y="428" font-size="15.5" fill="#333">Most of you could identify what was largest or most prominent. The</text>
  <text x="64" y="450" font-size="15.5" fill="#333">strongest notes told a grid apart from a real hierarchy.</text>

  <rect x="64" y="474" width="404" height="46" fill="#f7f7f7"/>
  <rect x="64" y="474" width="3" height="46" fill="#a15c3f"/>
  <text x="80" y="493" font-size="13.5" fill="#444" font-style="italic">"No hierarchy present — only one</text>
  <text x="80" y="510" font-size="13.5" fill="#444" font-style="italic">drawing on each page."</text>

  <rect x="484" y="474" width="412" height="46" fill="#f7f7f7"/>
  <rect x="484" y="474" width="3" height="46" fill="#a15c3f"/>
  <text x="500" y="493" font-size="13.5" fill="#444" font-style="italic">"Large images communicate the main</text>
  <text x="500" y="510" font-size="13.5" fill="#444" font-style="italic">idea; smaller drawings provide the research."</text>
</svg>
