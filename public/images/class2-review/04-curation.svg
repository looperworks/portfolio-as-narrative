<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="64" font-size="11" font-weight="600" letter-spacing="2" fill="#3d7a6b">CATEGORY II OF V</text>
  <text x="62" y="104" font-size="32" font-weight="700" fill="#222">Image Selection &amp; Curation</text>
  <line x1="64" y1="126" x2="896" y2="126" stroke="#e8e8e8" stroke-width="1"/>

  <text x="64" y="156" font-size="11" font-weight="700" letter-spacing="1.5" fill="#3d7a6b">PAY ATTENTION TO</text>
  <text x="64" y="178" font-size="16" fill="#444">Whether each image earns its place — or just adds volume.</text>

  <!-- curation grid motif -->
  <g>
    <rect x="250" y="225" width="50" height="50" fill="#eef5f3" stroke="#3d7a6b" stroke-width="1.5"/>
    <rect x="320" y="225" width="50" height="50" fill="#eef5f3" stroke="#3d7a6b" stroke-width="1.5"/>
    <g>
      <rect x="390" y="225" width="50" height="50" fill="#f7f7f7" stroke="#d8d8d8" stroke-width="1.5"/>
      <line x1="390" y1="225" x2="440" y2="275" stroke="#9a9a9a" stroke-width="1.5"/>
    </g>
    <rect x="460" y="225" width="50" height="50" fill="#eef5f3" stroke="#3d7a6b" stroke-width="1.5"/>
    <g>
      <rect x="530" y="225" width="50" height="50" fill="#f7f7f7" stroke="#d8d8d8" stroke-width="1.5"/>
      <line x1="530" y1="225" x2="580" y2="275" stroke="#9a9a9a" stroke-width="1.5"/>
    </g>
    <rect x="600" y="225" width="50" height="50" fill="#eef5f3" stroke="#3d7a6b" stroke-width="1.5"/>

    <text x="250" y="299" font-size="11" fill="#3d7a6b" font-weight="600">4 KEPT</text>
    <text x="530" y="299" font-size="11" fill="#9a9a9a" font-weight="600">2 CUT — REPEATED INFORMATION</text>
  </g>

  <text x="64" y="336" font-size="11" font-weight="700" letter-spacing="1.5" fill="#3d7a6b">HOW THE CLASS RESPONDED</text>
  <text x="64" y="358" font-size="15.5" fill="#333">Most of you noticed variety — renders, diagrams, and models working</text>
  <text x="64" y="380" font-size="15.5" fill="#333">together. The strongest notes noticed restraint: when a project repeated itself.</text>

  <rect x="64" y="404" width="404" height="40" fill="#f7f7f7"/>
  <rect x="64" y="404" width="3" height="40" fill="#3d7a6b"/>
  <text x="80" y="420" font-size="13.5" fill="#444" font-style="italic">"Images appeal not only to the final</text>
  <text x="80" y="435" font-size="13.5" fill="#444" font-style="italic">product, but also the process."</text>

  <rect x="484" y="404" width="412" height="40" fill="#f7f7f7"/>
  <rect x="484" y="404" width="3" height="40" fill="#3d7a6b"/>
  <text x="500" y="420" font-size="13.5" fill="#444" font-style="italic">"Too many fabrication photos that</text>
  <text x="500" y="435" font-size="13.5" fill="#444" font-style="italic">do not add any information."</text>
</svg>
